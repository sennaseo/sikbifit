<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">식비핏 월 식비 예산 계산기</title>
  <desc id="desc">식사 패턴으로 월 식비와 절약 루틴을 계산하는 서비스 공유 이미지</desc>
  <rect width="1200" height="630" fill="#f7f5ef"/>
  <rect x="70" y="70" width="1060" height="490" rx="26" fill="#243f34"/>
  <circle cx="980" cy="150" r="86" fill="#f3bf4b"/>
  <circle cx="175" cy="480" r="70" fill="#6a9f78"/>
  <text x="120" y="180" fill="#dcebdd" font-family="Arial, sans-serif" font-size="34" font-weight="700">월 식비 예산 계산기</text>
  <text x="120" y="290" fill="#ffffff" font-family="Arial, sans-serif" font-size="92" font-weight="900">식비핏</text>
  <text x="120" y="380" fill="#f7f5ef" font-family="Arial, sans-serif" font-size="38" font-weight="700">외식, 배달, 장보기 패턴으로</text>
  <text x="120" y="435" fill="#f7f5ef" font-family="Arial, sans-serif" font-size="38" font-weight="700">이번 달 식비와 절약 루틴을 확인하세요.</text>
  <rect x="790" y="340" width="220" height="76" rx="14" fill="#f3bf4b"/>
  <text x="830" y="390" fill="#1d2520" font-family="Arial, sans-serif" font-size="30" font-weight="900">30초 계산</text>
</svg>
